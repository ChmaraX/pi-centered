name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  # Opens a release PR from Conventional Commits; merging it tags the version,
  # updates CHANGELOG.md and creates a GitHub release. Users install from git.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
